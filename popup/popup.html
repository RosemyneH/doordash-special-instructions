<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DoorDash Special Instructions</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Special instructions</h1>
    <p class="hint">
      Opens an editor on the DoorDash tab with one notes box per cart item, like
      the old “Add special instructions” field.
    </p>
    <label for="fulfillment">Fulfillment</label>
    <select id="fulfillment">
      <option value="Delivery">Delivery</option>
      <option value="Pickup">Pickup</option>
    </select>
    <label class="checkbox">
      <input type="checkbox" id="autoCheckout" />
      Open editor automatically on checkout
    </label>
    <button type="button" id="open" class="primary">Open editor on this tab</button>
    <p id="status" role="status"></p>
    <script src="popup.js" type="module"></script>
  </body>
</html>
