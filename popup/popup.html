<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DoorDash Special Instructions</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Special instructions</h1>
    <p class="hint">
      Edit boxes are added directly on your cart (open the cart drawer or go to
      checkout). Each item gets its own “Special instructions” field.
    </p>
    <label for="fulfillment">Fulfillment</label>
    <select id="fulfillment">
      <option value="Delivery">Delivery</option>
      <option value="Pickup">Pickup</option>
    </select>
    <button type="button" id="refresh" class="primary">Refresh fields on tab</button>
    <p id="status" role="status"></p>
    <script src="popup.js" type="module"></script>
  </body>
</html>
